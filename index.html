<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎰 Culinary Roulette</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h2 { margin-bottom: 20px; text-align: center; }
    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
    }
    #canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      z-index: 10;
    }
    button {
      margin-top: 30px;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      background: var(--tg-theme-button-color, #ff6b6b);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #2ed573;
    }

    /* Добавленные правила: контрастный черный текст для секторов и canvas */
    .wheel-text, .sector-text, canvas {
      color: #000000 !important;
      fill: #000000 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2 id="wheel-title">🎰 Кулинарная Рулетка</h2>
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>

  <button id="spin-btn" onclick="spin()">КРУТИТЬ КОЛЕСО!</button>
  <div id="result"></div>

  <script>
    // Инициализация Telegram WebApp и мультиязычность
    const tg = window.Telegram?.WebApp;
    if (tg && typeof tg.expand === 'function') {
      try { tg.expand(); } catch (e) { /* ignore */ }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    const userLang = langParam || tg?.initDataUnsafe?.user?.language_code || 'ru';

    const translations = {
      en: { spinBtn: "🎲 Spin the Wheel!", title: "🎰 Culinary Roulette", winPrefix: "🎉 You got: " },
      uk: { spinBtn: "🎲 Крутити колесо!", title: "🎰 Кулінарна Рулетка", winPrefix: "🎉 Випало: " },
      ru: { spinBtn: "🎲 Вращать колесо!", title: "🎰 Что будем готовить?", winPrefix: "🎉 Выпало: " }
    };

    let currentLang = 'ru';
    if (typeof userLang === 'string') {
      if (userLang.startsWith('uk') || userLang.startsWith('ua')) { currentLang = 'uk'; }
      else if (userLang.startsWith('en')) { currentLang = 'en'; }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById('spin-btn');
      const title = document.getElementById('wheel-title');

      if (btn) btn.innerText = translations[currentLang].spinBtn;
      if (title) title.innerText = translations[currentLang].title;
      document.title = translations[currentLang].title;
    });

    // --- Utility: безопасное декодирование ---
    function decodeSafe(s) {
      if (!s && s !== '') return '';
      s = String(s).replace(/\+/g, ' ');
      try {
        return decodeURIComponent(s);
      } catch (e) {
        return s;
      }
    }

    function parseItemsFromString(raw) {
      if (raw == null) return null;
      raw = String(raw).trim();
      if (raw === '') return null;

      if (raw.includes('=') || raw.includes('&')) {
        try {
          const sp = new URLSearchParams(raw);
          let v = sp.get('items');
          if (v == null) v = raw;
          v = decodeSafe(v);
          return v.split(',').map(i => i.trim()).filter(i => i.length > 0);
        } catch (e) {}
      }

      const decoded = decodeSafe(raw);
      return decoded.split(',').map(i => i.trim()).filter(i => i.length > 0);
    }

    let itemsParam = null;
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const itemsFromUrl = urlParams.get('items');
      if (itemsFromUrl) {
        itemsParam = itemsFromUrl;
      } else if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        itemsParam = tg.initDataUnsafe.start_param;
      }
    } catch (e) {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        itemsParam = tg.initDataUnsafe.start_param;
      }
    }

    const parsed = parseItemsFromString(itemsParam);
    let options = Array.isArray(parsed) && parsed.length > 0
      ? parsed
      : ['Паста', 'Суп', 'Пицца', 'Салат', 'Бургер', 'Суши'];

    if (!options || options.length === 0) {
      options = ['Паста', 'Суп', 'Пицца', 'Салат', 'Бургер', 'Суши'];
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const numOptions = options.length;
    const arc = Math.PI * 2 / numOptions;
    let startAngle = 0;
    let isSpinning = false;

    const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e'];

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numOptions; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, angle, angle + arc, false);
        ctx.lineTo(200, 200);
        ctx.fill();

        ctx.save();
        ctx.fillStyle = "#000000";
        ctx.font = "bold 18px Arial";
        ctx.translate(200 + Math.cos(angle + arc / 2) * 130, 200 + Math.sin(angle + arc / 2) * 130);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = options[i];
        if (ctx.measureText(text).width < 140) {
          ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        } else {
          const parts = text.split(' ');
          const half = Math.ceil(parts.length / 2);
          const line1 = parts.slice(0, half).join(' ');
          const line2 = parts.slice(half).join(' ');
          ctx.fillText(line1, -ctx.measureText(line1).width / 2, -8);
          ctx.fillText(line2, -ctx.measureText(line2).width / 2, 12);
        }
        ctx.restore();
      }
    }

    drawWheel();

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('result').innerText = '';

      const spinAngleStart = Math.random() * 10 + 10;
      let spinTime = 0;
      const spinTimeTotal = Math.random() * 3000 + 4000;

      function rotate() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
          stopRotate();
          return;
        }
        const spinAngle = spinAngleStart - (spinTime / spinTimeTotal) * spinAngleStart;
        startAngle += (spinAngle * Math.PI / 180);
        drawWheel();
        requestAnimationFrame(rotate);
      }
      rotate();
    }

    function stopRotate() {
      isSpinning = false;
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - degrees % 360) / arcd);
      const winner = options[(index + numOptions) % numOptions];

      document.getElementById('result').innerText = `${translations[currentLang].winPrefix}${winner}!`;

      if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
        try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) { /* ignore */ }
      }

      setTimeout(() => {
        if (tg && typeof tg.sendData === 'function') {
          try { tg.sendData(JSON.stringify({ chosen_dish: winner })); } catch (e) { /* ignore */ }
        }
      }, 1500);
    }
  </script>
</body>
</html>
