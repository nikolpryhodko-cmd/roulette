<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Кулинарная Рулетка</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h2 { margin-bottom: 20px; text-align: center; }
    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
    }
    #canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      z-index: 10;
    }
    button {
      margin-top: 30px;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      background: var(--tg-theme-button-color, #ff6b6b);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #2ed573;
    }
  </style>
</head>
<body>

  <h2>🎰 Что будем готовить?</h2>
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>

  <button id="spinBtn" onclick="spin()">КРУТИТЬ КОЛЕСО!</button>
  <div id="result"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg && typeof tg.expand === 'function') {
      try { tg.expand(); } catch (e) { /* ignore */ }
    }

    // --- Utility: безопасное декодирование ---
    function decodeSafe(s) {
      if (!s && s !== '') return '';
      // Replace pluses with spaces (in case the value was form-encoded)
      s = String(s).replace(/\+/g, ' ');
      try {
        return decodeURIComponent(s);
      } catch (e) {
        // Если decodeURIComponent ломается на неожиданных последовательностях,
        // возвращаем оригинальную (с уже заменёнными плюсами) строку.
        return s;
      }
    }

    // Попытка распарсить items из строки. Поддерживает:
    // - plain comma-separated (e.g. "Макароны, Омлет, Стейк")
    // - percent-encoded
    // - query-like strings ("items=...&foo=bar")
    function parseItemsFromString(raw) {
      if (raw == null) return null;
      raw = String(raw).trim();
      if (raw === '') return null;

      // Если строка выглядит как query-string (с '=' или '&'), пробуем URLSearchParams
      if (raw.includes('=') || raw.includes('&')) {
        try {
          const sp = new URLSearchParams(raw);
          let v = sp.get('items');
          if (v == null) {
            // Если нет ключа items, возможно весь raw — это значение
            v = raw;
          }
          v = decodeSafe(v);
          return v.split(',').map(i => i.trim()).filter(i => i.length > 0);
        } catch (e) {
          // fallthrough to naive parsing
        }
      }

      // Иначе — обычный CSV-like список
      const decoded = decodeSafe(raw);
      return decoded.split(',').map(i => i.trim()).filter(i => i.length > 0);
    }

    // --- Чтение параметров items: сначала из window.location.search, затем из Telegram start_param ---
    let itemsParam = null;
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const itemsFromUrl = urlParams.get('items');
      if (itemsFromUrl) {
        itemsParam = itemsFromUrl;
      } else if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        // start_param может быть просто списком "A,B,C" или query-string "items=A,B,C"
        itemsParam = tg.initDataUnsafe.start_param;
      }
    } catch (e) {
      // В необычных окружениях URLSearchParams может бросать — игнорируем и пробуем tg.initDataUnsafe
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        itemsParam = tg.initDataUnsafe.start_param;
      }
    }

    // Парсим items в массив options
    const parsed = parseItemsFromString(itemsParam);
    let options = Array.isArray(parsed) && parsed.length > 0
      ? parsed
      : ['Паста', 'Суп', 'Пицца', 'Салат', 'Бургер', 'Суши'];

    // Защита: если полученный массив пустой — ставим дефолт
    if (!options || options.length === 0) {
      options = ['Паста', 'Суп', 'Пицца', 'Салат', 'Бургер', 'Суши'];
    }

    // --- Настройка canvas и рисования ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const numOptions = options.length;
    const arc = Math.PI * 2 / numOptions;
    let startAngle = 0;
    let isSpinning = false;

    // Набор цветов (если хотите, поменяйте/расширьте)
    const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#00cec9', '#fdcb6e'];

    function drawWheel() {
      // Очистка холста перед перерисовкой
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numOptions; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, angle, angle + arc, false);
        ctx.lineTo(200, 200);
        ctx.fill();

        // Текст
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";
        ctx.translate(200 + Math.cos(angle + arc / 2) * 130, 200 + Math.sin(angle + arc / 2) * 130);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        const text = options[i];
        // Поддержка переноса слишком длинного текста (тривиально)
        if (ctx.measureText(text).width < 140) {
          ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
        } else {
          // Разбиваем по пробелам на две строки
          const parts = text.split(' ');
          const half = Math.ceil(parts.length / 2);
          const line1 = parts.slice(0, half).join(' ');
          const line2 = parts.slice(half).join(' ');
          ctx.fillText(line1, -ctx.measureText(line1).width / 2, -8);
          ctx.fillText(line2, -ctx.measureText(line2).width / 2, 12);
        }
        ctx.restore();
      }
    }

    drawWheel();

    // --- Вращение ---
    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('result').innerText = '';

      const spinAngleStart = Math.random() * 10 + 10;
      let spinTime = 0;
      const spinTimeTotal = Math.random() * 3000 + 4000; // 4-7 секунд вращения

      function rotate() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
          stopRotate();
          return;
        }
        const spinAngle = spinAngleStart - (spinTime / spinTimeTotal) * spinAngleStart;
        startAngle += (spinAngle * Math.PI / 180);
        drawWheel();
        requestAnimationFrame(rotate);
      }
      rotate();
    }

    function stopRotate() {
      isSpinning = false;
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - degrees % 360) / arcd);
      const winner = options[(index + numOptions) % numOptions];

      document.getElementById('result').innerText = `🎉 Выпало: ${winner}!`;

      // Вибрация в Telegram при выигрыше
      if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
        try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) { /* ignore */ }
      }

      // Отправляем результат обратно в бота (если доступно)
      setTimeout(() => {
        if (tg && typeof tg.sendData === 'function') {
          try { tg.sendData(JSON.stringify({ chosen_dish: winner })); } catch (e) { /* ignore */ }
        }
      }, 1500);
    }
  </script>
</body>
</html>
